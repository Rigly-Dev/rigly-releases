name: Bug report
description: Something in Rigly doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the Rigly beta. Choosing **Send Feedback…** in Rigly's menu fills in the versions below for you.
        Please check the [troubleshooting guide](https://getrigly.com/docs/troubleshooting/) and the [open issues](https://github.com/Rigly-Dev/rigly-mac/issues) first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: "I turned on HTTPS for shop.test, and Safari shows a certificate warning."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: textarea
    id: doctor
    attributes:
      label: Output of `rigly doctor`
      description: Run `rigly doctor` in Terminal and paste the result. It shows Rigly's checks; it contains no passwords.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: From Rigly's Logs window, or `rigly logs` / `rigly logs caddy`. Remove anything private.
      render: text
  - type: input
    id: rigly-version
    attributes:
      label: Rigly version
      placeholder: "0.1.4 (120)"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
  - type: dropdown
    id: mac
    attributes:
      label: Mac
      options:
        - Apple silicon
        - Intel
  - type: textarea
    id: other-tools
    attributes:
      label: Anything else on this Mac that might matter?
      description: "For example Laravel Herd or Valet, MAMP, Docker, Homebrew PHP or nginx, or a VPN."
